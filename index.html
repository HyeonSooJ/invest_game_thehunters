<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>모의투자 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>.screen { display: none; } .active-screen { display: flex; }</style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    <audio id="bgm" src="assets/bgm.mp3" loop></audio>
    <button id="bgm-toggle" onclick="toggleBgm()" class="fixed top-3 right-3 z-[60] bg-white shadow-md rounded-full w-10 h-10 flex items-center justify-center text-lg">🔇</button>

    <div id="screen-main" class="screen active-screen min-h-screen items-center justify-center p-4">
        <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-2xl">
            <h1 class="text-2xl font-bold mb-6 text-center">더헌터스 모의투자</h1>
            <div class="flex flex-col gap-2 mb-4">
                <input type="text" id="nickname" placeholder="닉네임 입력" class="px-4 py-3 border rounded-xl">
                <button onclick="handleNickname()" id="nick-btn" class="bg-slate-800 text-white py-3 rounded-xl font-bold">확인</button>
                <div id="status-msg" class="text-sm font-bold text-blue-600 text-center h-5"></div>
                <input type="text" id="search-group" oninput="renderGroupList()" placeholder="그룹 검색..." class="px-4 py-2 border rounded-xl text-sm">
                <div id="state-display" class="text-xs text-gray-500 text-center font-bold">닉네임 - 그룹 미선택</div>
            </div>
            <div id="group-list" class="h-40 overflow-y-auto border rounded-xl p-2 space-y-2 text-sm mb-4"></div>
            <button onclick="handleMainButton()" id="main-btn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hidden">참가 확정</button>
            <div class="grid grid-cols-3 gap-2 mt-2">
                <button onclick="adminAction('create')" class="text-xs bg-slate-100 py-2 rounded-lg text-slate-600">그룹 생성</button>
                <button onclick="openRecordLookup()" class="text-xs bg-orange-100 py-2 rounded-lg text-orange-600">기록 조회</button>
                <button onclick="adminAction('reset')" class="text-xs bg-red-100 py-2 rounded-lg text-red-600">데이터 초기화</button>
            </div>
        </div>
    </div>

    <div id="modal-container" class="hidden fixed inset-0 bg-slate-50 z-50 flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white p-8 rounded-3xl max-w-sm w-full shadow-2xl"></div>
    </div>

    <div id="screen-game" class="screen min-h-screen items-center justify-center p-4">
        <div id="game-ui" class="max-w-2xl w-full bg-white p-10 rounded-3xl shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 id="round-title" class="text-2xl font-black"></h2>
                <span class="bg-slate-800 text-white text-[10px] px-3 py-1 rounded-full">기간: 2025.06~2026.06</span>
            </div>
            <p id="price-display" class="text-lg font-bold text-slate-700 mb-1"></p>
            <p id="fx-note" class="hidden text-xs text-slate-400 mb-3">환율 : 1000원으로 조정</p>
            <div id="trade-alert" class="hidden text-red-500 font-bold text-center mb-4 animate-pulse">⚠️ 대회 중 매수/매도 1번은 해야 합니다!</div>
            <div class="w-full h-64 mb-6"><canvas id="stockChart"></canvas></div>
            <div class="bg-slate-100 p-6 rounded-2xl mb-6 flex justify-between items-center">
                <div><p class="text-sm text-slate-500">예수금</p><p id="cash-display" class="text-2xl font-black text-blue-600">1,000,000</p></div>
                <div><p class="text-sm text-slate-500">보유 주식</p><p id="stock-display" class="text-2xl font-black text-emerald-600">0</p></div>
            </div>
            <div id="trade-input-area" class="mb-6 flex gap-2">
                <input type="number" id="qty-input" min="0" class="flex-grow p-4 border rounded-xl text-center text-lg font-bold" placeholder="수량 입력 후 사기/팔기 버튼">
                <button onclick="setMaxQty()" class="bg-slate-200 text-slate-700 px-4 rounded-xl font-bold text-sm">가능</button>
                <button onclick="trade('buy')" class="bg-red-500 text-white px-8 rounded-xl font-bold text-lg">사기</button>
                <button onclick="trade('sell')" class="bg-blue-500 text-white px-8 rounded-xl font-bold text-lg">팔기</button>
            </div>
            <button id="next-btn" onclick="nextQuarter()" class="w-full bg-slate-800 text-white py-4 rounded-xl font-bold">다음</button>
        </div>
        <div id="result-ui" class="hidden max-w-lg w-full bg-white p-8 rounded-3xl shadow-2xl text-center">
            <h2 id="result-title" class="text-2xl font-bold mb-4">결과</h2>
            <div id="stats-box" class="mb-6 text-left text-sm space-y-2"></div>
            <button id="result-btn" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold"></button>
        </div>
    </div>

    <script>
        /* ====================================================================
         * 참가자 데이터(그룹/닉네임/수익률)는 이 페이지가 직접 GitHub에 쓰지 않고,
         * Cloudflare Worker(WORKER_URL)를 통해서만 저장/조회합니다.
         * 진짜 GitHub 토큰은 Worker 안의 비밀 환경변수에만 있고, 이 HTML에는
         * 전혀 존재하지 않습니다 — 그래서 참가자들에게 토큰을 나눠줄 필요가 없고,
         * "소스 보기"를 해도 아무 비밀 값도 보이지 않습니다.
         * Worker 배포 방법은 cloudflare-worker/worker.js 파일 상단 주석을 참고하세요.
         * ==================================================================== */
        const WORKER_URL = 'https://investgame-thehunters.thehunters.workers.dev';

        async function callWorker(path, body) {
            const res = await fetch(`${WORKER_URL}${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body || {})
            });
            const result = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(result.error || `요청 실패 (${res.status})`);
            return result;
        }
        let latestState = { groups: [], participants: [] };
        async function fetchState() { latestState = await callWorker('/state', {}); return latestState; }
        function isDuplicateNickname(group, nickname) {
            return latestState.participants.some(p => p.group === group && p.nickname === nickname);
        }
        function offerNicknameEdit() {
            if (confirm("중복된 닉네임입니다. 사용하시려는 닉네임 뒤에 무언가를 붙여주세요!")) {
                document.getElementById('nickname').disabled = false;
                document.getElementById('nickname').focus();
                document.getElementById('nickname').select();
                document.getElementById('nick-btn').style.display = '';
                document.getElementById('status-msg').innerText = '';
            }
        }

        Chart.register(ChartDataLabels);

        const FX_RATE = 1000; // SanDisk(달러) 가격을 원화로 표시할 때 쓰는 고정 환율
        const INITIAL_CASH = 1000000;
        let state = { nick: "", group: "", isConfirmed: false, myDocId: null, currentRound: 0, currentQ: 0, cash: INITIAL_CASH, stockQty: 0, r1FinalCash: INITIAL_CASH, hasTraded: false };
        const rounds = [{ name: "1라운드", stock: "넥슨게임즈", prices: [13200, 13400, 12500, 11600, 10500] }, { name: "2라운드", stock: "SanDisk", prices: [40, 50, 210, 610, 1700].map(usd => usd * FX_RATE) }];
        const labels = ['2025년 06월', '2025년 09월', '2025년 12월', '2026년 03월', '종가'];
        const hints = [`<h2 class="text-xl font-bold mb-4">1라운드(넥슨게임즈)</h2><div class="text-sm space-y-3 text-left"><p>🟢 <b>블루 아카이브 일본 5주년 업데이트</b><br>일본 서비스 5주년을 맞은 대규모 업데이트 효과로 일본 앱스토어 매출 1위에 오르며 매출을 견인했습니다.</p><p>🟢 <b>서든어택 견조한 실적</b><br>서든어택의 안정적인 성과에 힘입어 전분기 대비 매출이 늘고 영업손실·순손실 폭도 줄었습니다.</p><p>🔴 <b>신작 공백과 비용 부담</b><br>올해 이렇다 할 신작 출시가 없는 가운데 개발비 지출이 이어지며 매출 감소와 적자 지속 우려가 나옵니다.</p><p>🔴 <b>전작 매출 모멘텀 둔화</b><br>2024년 출시작 '퍼스트 디센던트'가 이끌던 PC온라인 매출 규모를 작년만큼 유지하지 못하고 있습니다.</p></div><p class="text-xs text-gray-400 mt-4">* 2025년 1월~2025년 6월까지 정보입니다. 참고만 하시길 바랍니다.</p>`, `<h2 class="text-xl font-bold mb-4">2라운드(SanDisk)</h2><div class="text-sm space-y-3 text-left"><p>🟢 <b>웨스턴디지털에서 분사</b><br>2025년 2월 웨스턴디지털에서 독립 낸드플래시 전문기업으로 분사(스핀오프)하며 새 출발을 알렸습니다.</p><p>🟢 <b>AI發 메모리 수요 기대감</b><br>생성형 AI 인프라 투자 확대로 낸드플래시 공급 부족 우려가 커지며 관련주에 대한 기대감이 높아지고 있습니다.</p><p>🔴 <b>독자 생존 불확실성</b><br>스핀오프 직후라 독자적인 사업 운영 능력이 검증되지 않았고, 낸드 업황 특유의 높은 경기 순환성 리스크도 있습니다.</p><p>🔴 <b>중국발 경쟁 심화</b><br>중국 YMTC 등 후발주자들이 저가 물량 공세를 확대하고 있어 향후 가격 경쟁이 치열해질 수 있습니다.</p></div><p class="text-xs text-gray-400 mt-4">* 2025년 1월~2025년 6월까지 정보입니다. 참고만 하시길 바랍니다.</p>`];

        function handleNickname() { const n = document.getElementById('nickname').value; if(!n) return alert("닉네임 필수!"); state.nick = n; alert("한 번 입력하면 수정이 불가능합니다 ! 수정을 원하시면 새로고침을 눌러주세요 !"); document.getElementById('status-msg').innerText = `${n} 님 화이팅!!`; document.getElementById('nickname').disabled = true; document.getElementById('nick-btn').style.display = 'none'; }
        function openModal(html, callback) { document.getElementById('modal-container').classList.remove('hidden'); document.getElementById('modal-content').innerHTML = html + `<button onclick="closeModal()" class="w-full mt-6 bg-blue-600 text-white py-3 rounded-xl font-bold">확인</button>`; window.nextAction = callback; }
        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); if(window.nextAction) window.nextAction(); }
        function showHint(idx) { if(idx === 1) { state.stockQty = 0; } if (idx === 0) fadeBgmTo(0.1, 12000); openModal(hints[idx], () => { document.getElementById('screen-main').style.display = 'none'; document.getElementById('screen-game').style.display = 'flex'; stopBgm(); state.currentRound = idx; state.currentQ = 0; initChart(); updateGameUI(); }); }

        async function renderGroups() {
            try { await fetchState(); } catch (e) { console.error(e); return; }
            renderGroupList();
        }
        function renderGroupList() {
            const k = document.getElementById('search-group').value.toLowerCase();
            const groups = [...latestState.groups].sort((a, b) => a.name.localeCompare(b.name));
            const cnt = {};
            latestState.participants.forEach(p => { cnt[p.group] = (cnt[p.group] || 0) + 1; });
            const list = document.getElementById('group-list'); list.innerHTML = '';
            groups.forEach(g => {
                if (!g.name.toLowerCase().includes(k)) return;
                const div = document.createElement('div'); div.className = `p-3 border rounded cursor-pointer flex justify-between ${state.group === g.name ? 'bg-blue-50 border-blue-500' : ''}`; div.dataset.groupName = g.name;
                div.innerHTML = `<span ondblclick="updateGroupName('${g.id}', '${g.name}')">${g.name}</span> <span class="font-bold text-blue-600 group-count">${cnt[g.name] || 0}명</span>`;
                div.onclick = () => selectGroup(g.name); list.appendChild(div);
            });
        }
        function bumpGroupCount(groupName, delta) {
            const row = document.querySelector(`#group-list > div[data-group-name="${CSS.escape(groupName)}"]`);
            if (!row) return;
            const span = row.querySelector('.group-count');
            if (!span) return;
            const current = parseInt(span.textContent) || 0;
            span.textContent = `${Math.max(0, current + delta)}명`;
        }
        async function selectGroup(n) {
            if (state.group === n) return;
            if (state.group && !confirm("그룹 변경 시 기존 정보 삭제됩니다.")) return;
            if (state.myDocId) {
                await callWorker('/remove-participant', { id: state.myDocId });
                state.myDocId = null;
            }
            state.group = n; state.isConfirmed = false;
            document.getElementById('main-btn').classList.remove('hidden', 'bg-emerald-600');
            document.getElementById('main-btn').innerText = "참가 확정";
            document.getElementById('state-display').innerText = `${state.nick || "닉네임"} - ${n}`;
            renderGroups();
        }
        async function handleMainButton() {
            if(!state.isConfirmed) {
                if(!state.nick) return alert("닉네임 필수!");
                if (isDuplicateNickname(state.group, state.nick)) return offerNicknameEdit();
                bumpGroupCount(state.group, 1); // 응답 기다리지 않고 바로 반영 (실패 시 renderGroups로 복구됨)
                document.getElementById('main-btn').innerText = "대회 시작하기";
                document.getElementById('main-btn').classList.add('bg-emerald-600');
                try {
                    const r = await callWorker('/add-participant', { nickname: state.nick, group: state.group });
                    state.myDocId = r.id; state.isConfirmed = true;
                } catch (e) {
                    document.getElementById('main-btn').innerText = "참가 확정";
                    document.getElementById('main-btn').classList.remove('bg-emerald-600');
                    renderGroups();
                    if (e.message === 'duplicate') return offerNicknameEdit();
                    return alert("참가 등록 실패: " + e.message);
                }
            } else {
                openModal(`<h2 class="text-xl font-bold mb-4">모의투자대회 설명</h2><div class="text-sm text-left space-y-2"><p>1. 대회는 총 2라운드로 구성되고 각 라운드별 4번의 매수/매도 기회가 있습니다.</p><p>2. 투자기간 : 2025.06~2026.06</p><p>3. 대회 중 매수/매도 1번은 진행해야 합니다.</p><p>4. 재미로 즐겨주시면 감사하겠습니다 !! 화이팅 !!</p></div>`, () => showHint(0));
            }
        }
        async function adminAction(t) {
            const pw = prompt("관리자 비밀번호:");
            if (pw === null) return;
            try {
                if (t === 'reset') {
                    await callWorker('/reset', { adminPassword: pw });
                    location.reload();
                } else if (t === 'create') {
                    const n = prompt("그룹명:");
                    if (!n) return;
                    await callWorker('/create-group', { name: n, adminPassword: pw });
                    renderGroups();
                }
            } catch (e) {
                alert(e.message === 'unauthorized' ? '비밀번호가 틀렸습니다.' : e.message);
            }
        }
        async function updateGroupName(id, old) {
            const pw1 = prompt("관리자 비밀번호:");
            if (pw1 === null) return;
            const n = prompt("새 그룹명:", old);
            if (n === null) return;
            let currentName = old;
            if (n && n !== old) {
                try {
                    await callWorker('/rename-group', { id, name: n, adminPassword: pw1 });
                    currentName = n;
                    renderGroups();
                } catch (e) {
                    return alert(e.message === 'unauthorized' ? '비밀번호가 틀렸습니다.' : e.message);
                }
            }
            if (!confirm(`"${currentName}" 그룹을 삭제하시겠습니까?`)) return;
            const pw2 = prompt("관리자 비밀번호:");
            if (pw2 === null) return;
            try {
                await callWorker('/delete-group', { id, adminPassword: pw2 });
                renderGroups();
            } catch (e) {
                alert(e.message === 'unauthorized' ? '비밀번호가 틀렸습니다.' : e.message);
            }
        }

        function escAttr(s) { return String(s).replace(/'/g, "\\'"); }
        function closeRecordModal() { document.getElementById('modal-container').classList.add('hidden'); }
        async function openRecordLookup() {
            const pw = prompt("관리자 비밀번호:");
            if (pw === null) return;
            await backToRecordGroupList(pw);
        }
        async function backToRecordGroupList(pw) {
            let data;
            try { data = await fetchState(); } catch (e) { return alert('데이터를 불러오지 못했습니다: ' + e.message); }
            const groups = [...data.groups].sort((a, b) => a.name.localeCompare(b.name));
            let html = `<h2 class="text-xl font-bold mb-4">그룹 선택</h2>`;
            if (groups.length === 0) {
                html += `<p class="text-sm text-gray-500">생성된 그룹이 없습니다.</p>`;
            } else {
                html += `<div class="max-h-72 overflow-y-auto space-y-2">`;
                groups.forEach(g => {
                    html += `<div class="p-3 border rounded cursor-pointer hover:bg-slate-50" onclick="openRecordTable('${escAttr(pw)}', '${escAttr(g.name)}')">${g.name}</div>`;
                });
                html += `</div>`;
            }
            html += `<button onclick="closeRecordModal()" class="w-full mt-6 bg-slate-200 text-slate-700 py-3 rounded-xl font-bold">닫기</button>`;
            document.getElementById('modal-container').classList.remove('hidden');
            document.getElementById('modal-content').innerHTML = html;
        }
        async function openRecordTable(pw, groupName) {
            let data;
            try { data = await fetchState(); } catch (e) { return alert('데이터를 불러오지 못했습니다: ' + e.message); }
            const list = data.participants.filter(p => p.group === groupName).sort((a, b) => (b.profit || 0) - (a.profit || 0));
            let html = `<h2 class="text-xl font-bold mb-1">${groupName}</h2><p class="text-xs text-gray-400 mb-4">닉네임을 클릭하면 삭제할 수 있습니다.</p>`;
            if (list.length === 0) {
                html += `<p class="text-sm text-gray-500">참가자가 없습니다.</p>`;
            } else {
                html += `<div class="max-h-72 overflow-y-auto"><table class="w-full text-center text-sm"><thead><tr><th>순위</th><th>닉네임</th><th>수익률</th></tr></thead><tbody>`;
                list.forEach((p, i) => {
                    html += `<tr class="cursor-pointer hover:bg-red-50" onclick="confirmDeleteParticipant('${escAttr(pw)}', '${escAttr(groupName)}', '${escAttr(p.nickname)}')"><td>${i + 1}</td><td>${p.nickname}</td><td>${(p.profit || 0).toFixed(2)}%</td></tr>`;
                });
                html += `</tbody></table></div>`;
            }
            html += `<div class="flex gap-2 mt-6"><button onclick="backToRecordGroupList('${escAttr(pw)}')" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold">그룹 목록</button><button onclick="closeRecordModal()" class="flex-1 bg-slate-200 text-slate-700 py-3 rounded-xl font-bold">닫기</button></div>`;
            document.getElementById('modal-container').classList.remove('hidden');
            document.getElementById('modal-content').innerHTML = html;
        }
        async function confirmDeleteParticipant(pw, groupName, nickname) {
            if (!confirm(`"${nickname}" 님을 삭제하시겠습니까?`)) return;
            try {
                await callWorker('/delete-participant', { group: groupName, nickname, adminPassword: pw });
                renderGroups();
                openRecordTable(pw, groupName);
            } catch (e) {
                alert(e.message === 'unauthorized' ? '비밀번호가 틀렸습니다.' : e.message);
            }
        }

        function initChart() { const ctx = document.getElementById('stockChart').getContext('2d'); if(window.myChart) myChart.destroy(); myChart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [{ label: '가격', data: [], borderColor: '#3b82f6', datalabels: { anchor: 'end', align: 'top', formatter: (v) => v.toLocaleString() } }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { datalabels: { display: true } } } }); }
        function updateGameUI() { const isC = state.currentQ === 4; document.getElementById('round-title').innerText = `${state.currentRound + 1}라운드 - ${rounds[state.currentRound].stock}(${isC ? '종가' : (state.currentQ + 1) + '분기'})`; document.getElementById('price-display').innerText = `현재가 : ${rounds[state.currentRound].prices[state.currentQ].toLocaleString()}원`; document.getElementById('fx-note').classList.toggle('hidden', state.currentRound !== 1); document.getElementById('cash-display').innerText = state.cash.toLocaleString(); document.getElementById('stock-display').innerText = state.stockQty; document.getElementById('trade-input-area').style.display = isC ? 'none' : 'flex'; myChart.data.labels = labels.slice(0, state.currentQ + 1); myChart.data.datasets[0].data = rounds[state.currentRound].prices.slice(0, state.currentQ + 1); myChart.update(); }
        function setMaxQty() { const p = rounds[state.currentRound].prices[state.currentQ]; document.getElementById('qty-input').value = Math.floor(state.cash / p); }
        function trade(t) { const q = parseInt(document.getElementById('qty-input').value); if(isNaN(q) || q <= 0) return alert("1 이상의 수량을 입력하세요"); if(!confirm(`${q}주를 ${t === 'buy' ? '사시겠습니까?' : '파시겠습니까?'}`)) return; if(q > 0) state.hasTraded = true; const p = rounds[state.currentRound].prices[state.currentQ]; if(t === 'buy') { if(state.cash < q * p) return alert("예수금 부족"); state.cash -= q * p; state.stockQty += q; } else { if(state.stockQty < q) return alert("보유 주식 부족"); state.cash += q * p; state.stockQty -= q; } updateGameUI(); }
        function nextQuarter() {
            if (state.currentRound === 1 && state.currentQ === 3 && !state.hasTraded) return alert("대회 중 매수/매도 1번은 해야 합니다!");
            if(state.currentQ < 3) { state.currentQ++; updateGameUI(); }
            else if(state.currentQ === 3) { if (state.stockQty > 0) { state.cash += state.stockQty * rounds[state.currentRound].prices[4]; state.stockQty = 0; } state.currentQ = 4; updateGameUI(); }
            else { showResult(state.currentRound === 1, state.cash); }

            const qtyInput = document.getElementById('qty-input');
            qtyInput.value = '';
            qtyInput.placeholder = '수량 입력 후 사기/팔기 버튼';
        }
        function showResult(isF, f) { document.getElementById('game-ui').classList.add('hidden'); document.getElementById('result-ui').classList.remove('hidden'); let initialCash = !isF ? INITIAL_CASH : state.r1FinalCash; let profit = (f / initialCash * 100 - 100); if (!isF) { state.r1FinalCash = f; document.getElementById('result-title').innerText = "1라운드 결과"; document.getElementById('stats-box').innerHTML = `<p>초기 예수금 : ${initialCash.toLocaleString()}</p><p>현재 예수금 : ${f.toLocaleString()}</p><p>수익률 : ${profit.toFixed(2)}%</p>`; document.getElementById('result-btn').innerText = "2라운드 힌트 보기"; document.getElementById('result-btn').onclick = () => { document.getElementById('game-ui').classList.remove('hidden'); document.getElementById('result-ui').classList.add('hidden'); state.cash = state.r1FinalCash; showHint(1); }; } else { document.getElementById('result-title').innerText = "2라운드 결과"; document.getElementById('stats-box').innerHTML = `<p>초기 예수금 : ${initialCash.toLocaleString()}</p><p>현재 예수금 : ${f.toLocaleString()}</p><p>수익률 : ${profit.toFixed(2)}%</p>`; document.getElementById('result-btn').innerText = "최종 결과 확인"; document.getElementById('result-btn').onclick = () => showFinalResult(f); } }
        async function showFinalResult(f) {
            let finalProfit = (f / INITIAL_CASH * 100 - 100);
            document.getElementById('result-title').innerText = "최종 결과";
            document.getElementById('stats-box').innerHTML = `<p>초기 예수금 : ${INITIAL_CASH.toLocaleString()}</p><p>최종 금액 : ${f.toLocaleString()}</p><p>최종 수익률 : ${finalProfit.toFixed(2)}%</p>`;
            const myId = state.myDocId; const profitVal = parseFloat(finalProfit.toFixed(2));
            await callWorker('/update-profit', { id: myId, profit: profitVal });
            document.getElementById('result-btn').innerText = "순위 보기";
            document.getElementById('result-btn').onclick = showRankings;
        }
        async function showRankings() {
            const data = await fetchState();
            let list = data.participants.filter(p => p.group === state.group).map(p => ({ name: p.nickname, profit: p.profit || 0 }));
            list.sort((a, b) => b.profit - a.profit);
            const me = list.find(x => x.name === state.nick);
            let h = `<div class="mb-4 p-3 bg-purple-100 border-2 border-purple-500 rounded-xl font-bold">나의 닉네임 : ${state.nick}<br>나의 수익률 : ${(me ? me.profit : 0).toFixed(2)}%</div><div class="max-h-60 overflow-y-auto"><table class="w-full text-center text-sm"><thead><tr><th>순위</th><th>닉네임</th><th>수익률</th></tr></thead><tbody>`;
            list.forEach((item, i) => { const isMe = item.name === state.nick; h += `<tr class="${isMe ? 'bg-purple-200 border-2 border-purple-500 font-bold' : ''}"><td>${i+1}위</td><td>${item.name}</td><td>${item.profit.toFixed(2)}%</td></tr>`; });
            h += `</tbody></table></div>`;
            document.getElementById('stats-box').innerHTML = h;
            document.getElementById('result-btn').innerText = "종료 (새로고침)";
            document.getElementById('result-btn').onclick = () => location.reload();
        }

        renderGroups();
        setInterval(renderGroups, 8000); // 실시간 구독 대신 폴링으로 갱신합니다.

        // 배경음악: 닉네임 입력~그룹 선택 화면(screen-main)에서만 무한 반복 재생하고,
        // 대회가 시작돼 screen-game으로 넘어가면 멈춥니다. 브라우저 자동재생 정책상
        // 소리 있는 재생은 보통 막혀 있어서, 우선 시도해보고 막히면 사용자가 화면을
        // 처음 클릭/터치할 때(단, 음악 버튼 클릭은 제외) 재생을 시작합니다.
        const bgm = document.getElementById('bgm');
        const bgmToggle = document.getElementById('bgm-toggle');
        function setBgmIcon() { bgmToggle.textContent = bgm.paused ? '🔇' : '🔊'; }
        function tryPlayBgm() { bgm.play().then(setBgmIcon).catch(() => {}); }
        function toggleBgm() { if (bgm.paused) tryPlayBgm(); else { bgm.pause(); setBgmIcon(); } }
        let bgmFadeToken = 0;
        function fadeBgmTo(targetVolume, durationMs, onDone) {
            const myToken = ++bgmFadeToken;
            const startVolume = bgm.volume;
            const startTime = performance.now();
            function step(now) {
                if (myToken !== bgmFadeToken) return; // 더 최신 페이드에 의해 취소됨
                const t = Math.min(1, (now - startTime) / durationMs);
                bgm.volume = startVolume + (targetVolume - startVolume) * t;
                if (t < 1) requestAnimationFrame(step); else if (onDone) onDone();
            }
            requestAnimationFrame(step);
        }
        function stopBgm() {
            bgmToggle.style.display = 'none';
            fadeBgmTo(0, 600, () => { bgm.pause(); bgm.currentTime = 0; bgm.volume = 1; });
        }
        tryPlayBgm();
        ['click', 'touchstart', 'keydown'].forEach(evt => {
            document.addEventListener(evt, function startOnce(e) {
                if (e.target && e.target.id !== 'bgm-toggle' && bgm.paused) tryPlayBgm();
                document.removeEventListener(evt, startOnce);
            }, { once: true });
        });
    </script>
</body>
</html>
